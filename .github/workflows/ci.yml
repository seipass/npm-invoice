name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: node ./bin/npm-invoice.js express --no-color
      - name: Verify pre-publish GitHub command
        if: matrix.node == 24
        run: npx --yes --package=github:seipass/npm-invoice npm-invoice express --no-color
